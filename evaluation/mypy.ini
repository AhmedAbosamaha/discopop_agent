# Type checking for the evaluation harness (scripts, not a package):
#   venv/bin/python -m mypy --config-file=evaluation/mypy.ini evaluation/agent/tools/*.py evaluation/shared/*.py
# The harness was developed in its own repository under mypy's default strictness and is
# clean there. The agent's stricter mypy.ini (generic type arguments, no untyped defs)
# reports 126 style findings on it; bringing the harness up to that level is a follow-up,
# kept out of the move on purpose so the move changes no code.
[mypy]
ignore_missing_imports = True
